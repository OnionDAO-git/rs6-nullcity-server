services:
  runejs_game_server:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/usr/src/app/data
      - ./cache:/usr/src/app/cache
      - ./config:/usr/src/app/config
    ports:
      - "43594:43594"
      - "127.0.0.1:43595:43595"

networks:
  default:
    name: runejs_network
