# Paid-model example controller config — S-INFER-MODEL-1 (2026-05-31)
#
# Drop-in to point the resident brain at the paid Haiku model via OpenRouter.
# This is an EXAMPLE for the demo model switch + the A/B re-benchmark; it does
# NOT replace the live controller.yml. See:
#   docs/capability-evidence/2026-05-31-inference-model-comparison.md
#
# Usage (A/B re-benchmark on the paid model):
#   set -a; source .env.local; set +a          # provides OPENROUTER_API_KEY
#   npm run controller:bench -- --task all \
#     --module onion.runescape.standard --mode autonomous \
#     --config config/controller.paid-example.yml \
#     --output data/benchmarks/model-intelligence-paid-2026-05-31
#
# No secrets in source: apiKey is interpolated from the environment.

gateway:
  url: ws://127.0.0.1:43595
  controllerId: nullcity-controller

souls:
  dir: ../src/controller/soul/starter-souls

memory:
  dir: ../data/controller/memory
  qmdBin: qmd

logging:
  dir: ../data/controller/logs
  fullPerceptions: false

inference:
  maxConcurrent: 2

llm:
  endpoints:
    # --- DEFAULT BRAIN = PAID HAIKU ----------------------------------------
    # Switching `default` flips the brain for EVERY resident that does not
    # carry a per-resident `model.endpoint` override in its soul frontmatter.
    default:
      baseUrl: https://openrouter.ai/api
      provider: openrouter
      apiKey: ${OPENROUTER_API_KEY}
      model: anthropic/claude-3.5-haiku
      responseFormat: text          # OpenRouter returns message.reasoning; text parses cleanest
      timeoutMs: 45000
      cost:
        promptTokenUsd: 0.0000008   # $0.80 / 1M prompt tokens
        completionTokenUsd: 0.000004 # $4.00 / 1M completion tokens  (~$0.55 / 1k brain calls)

    # --- LOCAL FALLBACKS (free, owned hardware) ----------------------------
    # Keep these defined so you can scope individual residents back to local
    # via `model.endpoint: inf_qwen` / `spacetower_qwopus_q4` in their soul.
    inf_qwen:
      baseUrl: http://inf.nullcity.ai:1234
      provider: openai-compatible
      model: qwen/qwen3.6-27b
      timeoutMs: 60000
    spacetower_qwopus_q4:
      baseUrl: http://spacetower.nullcity.ai:8100
      provider: openai-compatible
      model: qwopus3.5-27b-v3@q4_k_s
      timeoutMs: 30000

  profiles:
    # Named overlays usable from soul frontmatter `model.endpoint: <name>`.
    # HEROES-ONLY SCOPING: leave `default` = local Qwen above, then set
    #   model:
    #     endpoint: openrouter_haiku
    # in each hero soul (.md frontmatter) so ONLY heroes pay for paid inference.
    openrouter_haiku:
      endpoint: default            # reuse the paid endpoint baseUrl/provider/key
      model: anthropic/claude-3.5-haiku
      timeoutMs: 45000
      cost:
        promptTokenUsd: 0.0000008
        completionTokenUsd: 0.000004
    # Storyteller: smarter/slower, NOT a tick-by-tick body loop (see model-benchmarking.md).
    openrouter_storyteller:
      endpoint: default
      model: ${OPENROUTER_STORYTELLER_MODEL}   # anthropic/claude-3.7-sonnet by default
      timeoutMs: 90000

patrons:
  - handle: demo@onion
    kind: patron_witness
