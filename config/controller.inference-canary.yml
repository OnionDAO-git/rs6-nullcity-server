gateway:
  url: ws://127.0.0.1:43595
  controllerId: nullcity-controller

souls:
  dir: ../src/controller/soul/starter-souls

memory:
  dir: ../data/controller/memory
  qmdBin: qmd

logging:
  dir: ../data/controller/logs
  fullPerceptions: false

inference:
  maxConcurrent: 2

llm:
  endpoints:
    # Proven demo baseline. Qwen is non-serving as of 2026-05-31; keep default on qwopus.
    default:
      baseUrl: http://inf.nullcity.ai:1234
      model: qwopus3.5-27b-v3@q4_k_s
      timeoutMs: 75000
    # Dev's new canary URL + quantized model. Fast enough for live resident experiments.
    spacetower_qwopus_q4:
      baseUrl: http://spacetower.nullcity.ai:8100
      model: qwopus3.5-27b-v3@q4_k_s
      timeoutMs: 30000

patrons:
  - handle: demo@onion
    kind: patron_witness
