gateway:
  url: ws://127.0.0.1:43595
  controllerId: nullcity-controller

souls:
  dir: ../src/controller/soul/starter-souls

memory:
  dir: ../data/controller/memory
  qmdBin: qmd

logging:
  dir: ../data/controller/logs
  fullPerceptions: false

inference:
  maxConcurrent: 2

llm:
  endpoints:
    # Serving demo baseline. The exact quantized id qwopus3.5-27b-v3@q4_k_s
    # is listed on both owned boxes but currently rejects even tiny probes with
    # "Context size has been exceeded"; the unsuffixed serving alias works.
    default:
      baseUrl: http://spacetower.nullcity.ai:8100
      model: qwopus3.5-27b-v3
      timeoutMs: 240000
      # Spacetower's q4 qwopus currently rejects resident-sized thinking-mode
      # prompts. Keep live canaries bounded until Dev changes the serving stack.
      maxTokens: 512
      forceThinking: false
    spacetower_qwopus_q4:
      baseUrl: http://spacetower.nullcity.ai:8100
      model: qwopus3.5-27b-v3
      timeoutMs: 30000
      maxTokens: 512
      forceThinking: false
    # Keep the inf host named for explicit diagnostics/benchmarking, but do not
    # use it as default while it returns context-size 400s on tiny probes.
    inf_qwopus_q4:
      baseUrl: http://inf.nullcity.ai:1234
      model: qwopus3.5-27b-v3
      timeoutMs: 240000
      maxTokens: 512
      forceThinking: false

patrons:
  - handle: demo@onion
    kind: patron_witness
