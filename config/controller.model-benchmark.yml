# Post-demo inference benchmark config.
# Usage:
#   set -a; source .env.local; set +a
#   npm run inference:canary -- --config config/controller.model-benchmark.yml --all
#
# This preserves the demo-safe resident set while exposing named endpoint/model
# combinations for health checks and resident canary runs. OpenRouter is
# OpenAI-compatible. Anthropic-native keys are tracked in .env.local, but require
# a provider adapter before the controller can call Anthropic directly.

residents:
  - res:agent
  - res:hans
  - res:father-aereck
  - res:wise-old-man
  - res:duke-horacio
  - res:pip
  - res:thrand
  - res:qa-woodcutter
  - res:qa-angler
  - res:qa-guardian
  - res:qa-social
  - res:qa-cook
  - res:qa-scout
  - res:qa-trader
  - res:qa-survivor
  - res:qa-banker
  - res:qa-guide
  - res:qa-priest
  - res:qa-forager

gateway:
  url: ws://127.0.0.1:43595
  controllerId: nullcity-controller

souls:
  dir: ../src/controller/soul/starter-souls

memory:
  dir: ../data/controller/memory
  qmdBin: qmd

logging:
  dir: ../data/controller/logs
  fullPerceptions: false

inference:
  maxConcurrent: 2

llm:
  endpoints:
    # Owned hardware endpoints. Models are selected in llm.profiles below so
    # endpoint-vs-model comparisons stay unambiguous.
    inf:
      baseUrl: http://inf.nullcity.ai:1234
      provider: openai-compatible
      timeoutMs: 60000
    spacetower:
      baseUrl: http://spacetower.nullcity.ai:8100
      provider: openai-compatible
      timeoutMs: 60000
    openrouter:
      baseUrl: https://openrouter.ai/api
      apiKey: ${OPENROUTER_API_KEY}
      provider: openrouter
      responseFormat: text
      timeoutMs: 90000
  profiles:
    # Owned hardware, baseline model.
    inf_qwen:
      endpoint: inf
      model: qwen/qwen3.6-27b
    # Owned hardware, Dev's quantized smarter-model candidate on the second machine.
    spacetower_qwopus_q4:
      endpoint: spacetower
      model: qwopus3.5-27b-v3@q4_k_s
      timeoutMs: 30000
    # OpenRouter, useful for lower-cost intelligent resident canaries.
    openrouter_haiku:
      endpoint: openrouter
      model: ${OPENROUTER_HAIKU_MODEL}
      timeoutMs: 45000
      cost:
        promptTokenUsd: 0.0000008
        completionTokenUsd: 0.000004
    # OpenRouter, intended for periodic world-story summaries, not tick-by-tick body control.
    openrouter_storyteller:
      endpoint: openrouter
      model: ${OPENROUTER_STORYTELLER_MODEL}
      timeoutMs: 90000
    # Compatibility alias for souls or scripts that expect "default".
    default:
      endpoint: inf
      model: qwen/qwen3.6-27b

patrons:
  - handle: demo@onion
    kind: patron_witness
