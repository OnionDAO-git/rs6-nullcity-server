<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Null City Embassy — Wall</title>
    <style>
        :root {
            --ink: #f5ecd6;
            --ink-soft: rgba(245, 236, 214, 0.7);
            --ink-fade: rgba(245, 236, 214, 0.45);
            --bg: #0e0905;
            --bg-mid: #1a120a;
            --bg-card: #1f160c;
            --bg-card-fresh: #3a2914;
            --bg-roster: #160e07;
            --edge: #4f3a1c;
            --edge-soft: rgba(79, 58, 28, 0.55);
            --accent: #d49b4a;
            --accent-deep: #a06f2a;
            --death: #c14a3a;
            --death-deep: #6e2218;
            --celebrate: #7eb056;
            --celebrate-deep: #3a5d1f;
            --civic: #7a9fd0;
            --civic-deep: #2a4666;
            --rule: rgba(212, 155, 74, 0.25);
            --alive-dot: #7eb056;
            --dead-dot: #c14a3a;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            color: var(--ink);
            font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, 'Georgia', serif;
            min-height: 100vh;
            overflow: hidden;
        }
        body {
            background:
                radial-gradient(ellipse at 50% 0%, rgba(212, 155, 74, 0.08), transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(193, 74, 58, 0.05), transparent 55%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-mid) 100%);
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
        }
        header {
            text-align: center;
            padding: 1.75rem 1rem 1rem;
            border-bottom: 1px solid var(--edge);
            position: relative;
        }
        header::before, header::after {
            content: "❦";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-deep);
            font-size: 1.4rem;
            opacity: 0.55;
        }
        header::before { left: 2.5rem; }
        header::after { right: 2.5rem; }
        header h1 {
            margin: 0;
            font-size: 2.25rem;
            font-weight: normal;
            font-variant: small-caps;
            letter-spacing: 0.18em;
            color: var(--ink);
            text-shadow: 0 0 24px rgba(212, 155, 74, 0.15);
        }
        header .subtitle {
            margin-top: 0.45rem;
            color: var(--ink-soft);
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 0.04em;
        }

        /* Two-column layout: roster sidebar on the left, letters on the right */
        main {
            display: grid;
            grid-template-columns: 260px 1fr;
            overflow: hidden;
            position: relative;
        }

        /* ── LEFT: resident roster panel ────────────────────────────── */
        .roster {
            background: var(--bg-roster);
            border-right: 1px solid var(--edge);
            overflow-y: auto;
            padding: 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .roster-heading {
            font-size: 0.72rem;
            font-variant: small-caps;
            letter-spacing: 0.2em;
            color: var(--accent);
            border-bottom: 1px solid var(--rule);
            padding-bottom: 0.55rem;
            margin-bottom: 0.85rem;
        }
        .roster-empty {
            color: var(--ink-fade);
            font-style: italic;
            font-size: 0.88rem;
            padding: 0.5rem 0;
        }
        .resident-row {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.45rem 0.65rem;
            align-items: start;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(79, 58, 28, 0.25);
        }
        .resident-row:last-child { border-bottom: none; }
        .resident-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 0.35em;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;
        }
        .resident-dot.alive { color: var(--alive-dot); background: var(--alive-dot); }
        .resident-dot.dead  { color: var(--dead-dot);  background: var(--dead-dot);  opacity: 0.55; }
        .resident-info { min-width: 0; }
        .resident-name {
            font-size: 0.95rem;
            color: var(--ink);
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .resident-row.dead .resident-name {
            color: var(--ink-fade);
            text-decoration: line-through;
            text-decoration-color: rgba(193, 74, 58, 0.45);
        }
        .resident-goal {
            font-size: 0.78rem;
            color: var(--ink-soft);
            font-style: italic;
            line-height: 1.35;
            margin-top: 0.2rem;
            /* Two lines max to keep rows compact */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .resident-faction {
            display: inline-block;
            font-size: 0.6rem;
            font-variant: small-caps;
            letter-spacing: 0.1em;
            padding: 0.1rem 0.45rem;
            border-radius: 3px;
            margin-left: 0.4rem;
            vertical-align: middle;
            opacity: 0.88;
            white-space: nowrap;
        }
        .resident-row.dead .resident-faction { opacity: 0.4; }

        /* ── RIGHT: letters ticker ───────────────────────────────────── */
        .letters {
            overflow: hidden;
            padding: 1.5rem 2.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            position: relative;
        }
        /* faint vertical "scroll edge" guides */
        .letters::before, .letters::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(180deg, transparent, var(--edge-soft) 30%, var(--edge-soft) 70%, transparent);
        }
        .letters::before { left: 1rem; }
        .letters::after  { right: 1rem; }

        .card {
            background:
                linear-gradient(90deg, rgba(212, 155, 74, 0.04), transparent 8%, transparent 92%, rgba(212, 155, 74, 0.04)),
                var(--bg-card);
            border: 1px solid var(--edge);
            border-left: 3px solid var(--accent-deep);
            border-radius: 3px;
            padding: 0.95rem 1.4rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 0.6rem 1.25rem;
            align-items: baseline;
            transition: background 700ms ease-out, opacity 700ms ease-out, border-left-color 700ms ease-out, transform 700ms ease-out;
            opacity: 0.82;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        }
        .card.fresh {
            background:
                linear-gradient(90deg, rgba(212, 155, 74, 0.1), transparent 6%, transparent 94%, rgba(212, 155, 74, 0.1)),
                var(--bg-card-fresh);
            opacity: 1;
            animation: freshPulse 1.6s ease-out 2;
        }
        @keyframes freshPulse {
            0%   { box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 0 0 rgba(212, 155, 74, 0.25); }
            70%  { box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 0 14px rgba(212, 155, 74, 0); }
            100% { box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 0 0 rgba(212, 155, 74, 0); }
        }

        .card .kind {
            font-size: 0.72rem;
            font-variant: small-caps;
            letter-spacing: 0.14em;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            white-space: nowrap;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18), 0 1px 0 rgba(255, 255, 255, 0.06);
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
        }
        .card .kind.standing { background: linear-gradient(180deg, var(--celebrate), var(--celebrate-deep)); color: var(--ink); border: 1px solid var(--celebrate-deep); }
        .card .kind.epitaph  { background: linear-gradient(180deg, var(--death),     var(--death-deep));     color: var(--ink); border: 1px solid var(--death-deep);     }
        .card .kind.civic    { background: linear-gradient(180deg, var(--civic),     var(--civic-deep));     color: var(--ink); border: 1px solid var(--civic-deep);     }
        .card.epitaph-card   { border-left-color: var(--death); }
        .card.civic-card     { border-left-color: var(--civic); }
        .card.standing-card  { border-left-color: var(--celebrate); }

        .card .subject {
            font-size: 1.18rem;
            line-height: 1.35;
            color: var(--ink);
        }
        .card .ts {
            font-size: 0.85rem;
            color: var(--ink-fade);
            white-space: nowrap;
            font-variant: tabular-nums;
            letter-spacing: 0.02em;
        }
        .card .recipient {
            grid-column: 2 / 3;
            font-size: 0.86rem;
            color: var(--ink-soft);
            font-style: italic;
        }
        .card .from {
            grid-column: 3 / 4;
            font-size: 0.86rem;
            color: var(--ink-fade);
            text-align: right;
        }

        footer {
            border-top: 1px solid var(--edge);
            padding: 0.85rem 2.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.92rem;
            color: var(--ink-soft);
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.35));
        }
        footer .deaths {
            color: var(--death);
            font-variant: small-caps;
            letter-spacing: 0.1em;
            text-shadow: 0 0 12px rgba(193, 74, 58, 0.25);
        }
        footer .asof {
            color: var(--ink-fade);
            font-variant: tabular-nums;
            letter-spacing: 0.02em;
        }
        .empty {
            color: var(--ink-soft);
            text-align: center;
            padding: 4.5rem 1rem;
            font-style: italic;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
        }
        .error {
            color: #ffd6d0;
            background: linear-gradient(180deg, rgba(110, 34, 24, 0.5), rgba(60, 18, 12, 0.4));
            border: 1px solid var(--death);
            padding: 1rem 1.4rem;
            border-radius: 3px;
            margin: 1.25rem 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <h1>Null City Embassy</h1>
        <div class="subtitle">letters between residents and their patrons</div>
    </header>
    <main>
        <aside class="roster" id="roster">
            <div class="roster-heading">Who's Here</div>
            <div class="roster-empty" id="roster-empty">Loading…</div>
        </aside>
        <section class="letters" id="cards"><div class="empty">Loading…</div></section>
    </main>
    <footer>
        <span><span class="deaths" id="deaths">— deaths today</span></span>
        <span class="asof" id="asof">—</span>
    </footer>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const intervalMs = Math.max(1000, Number(params.get('intervalMs')) || 5000);
            const maxCards = Math.max(1, Number(params.get('limit')) || 8);
            const apiBase = params.get('api') || '/v1/wall/snapshot';

            const cardsElement = document.getElementById('cards');
            const rosterElement = document.getElementById('roster');
            const rosterEmpty = document.getElementById('roster-empty');
            const deathsElement = document.getElementById('deaths');
            const asofElement = document.getElementById('asof');

            const seen = new Set();
            let firstFetchDone = false;

            function letterKey(letter) {
                return String(letter.kind) + '|' + String(letter.recipient) + '|' + String(letter.dispatchedAt);
            }

            function classifyKind(kind) {
                switch (kind) {
                    case 'standing_tier_crossed': return 'standing';
                    case 'epitaph': return 'epitaph';
                    case 'civic_milestone': return 'civic';
                    default: return 'standing';
                }
            }

            function renderCard(letter) {
                const card = document.createElement('article');
                const klass = classifyKind(letter.kind);
                card.className = 'card ' + klass + '-card';
                const key = letterKey(letter);
                if (!seen.has(key) && firstFetchDone) {
                    card.classList.add('fresh');
                    setTimeout(function () { card.classList.remove('fresh'); }, 8000);
                }
                seen.add(key);

                const kind = document.createElement('span');
                kind.className = 'kind ' + klass;
                kind.textContent = String(letter.kind || '').replace(/_/g, ' ');
                card.appendChild(kind);

                const subject = document.createElement('span');
                subject.className = 'subject';
                subject.textContent = String(letter.subject || '(no subject)');
                card.appendChild(subject);

                const ts = document.createElement('span');
                ts.className = 'ts';
                ts.textContent = formatTs(letter.dispatchedAt);
                card.appendChild(ts);

                const recipient = document.createElement('span');
                recipient.className = 'recipient';
                recipient.textContent = 'for ' + String(letter.recipient || '?');
                card.appendChild(recipient);

                const from = document.createElement('span');
                from.className = 'from';
                from.textContent = 'from ' + String(letter.senderResident || '?');
                card.appendChild(from);

                return card;
            }

            function renderRoster(residents) {
                // Remove old resident rows; keep the heading.
                const heading = rosterElement.querySelector('.roster-heading');
                rosterElement.replaceChildren(heading || document.createTextNode(''));

                if (!Array.isArray(residents) || residents.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'roster-empty';
                    empty.textContent = 'No residents found.';
                    rosterElement.appendChild(empty);
                    return;
                }

                for (const r of residents) {
                    const row = document.createElement('div');
                    row.className = 'resident-row' + (r.alive ? '' : ' dead');

                    const dot = document.createElement('div');
                    dot.className = 'resident-dot ' + (r.alive ? 'alive' : 'dead');
                    row.appendChild(dot);

                    const info = document.createElement('div');
                    info.className = 'resident-info';

                    const name = document.createElement('div');
                    name.className = 'resident-name';
                    name.textContent = String(r.displayName || r.slug || '?');

                    if (r.factionDisplayName && r.factionColor) {
                        const badge = document.createElement('span');
                        badge.className = 'resident-faction';
                        // Use a translucent fill derived from the faction color.
                        badge.style.background = r.factionColor + '28';
                        badge.style.border = '1px solid ' + r.factionColor + '55';
                        badge.style.color = r.factionColor === '#0A0A0A' ? '#660000' : r.factionColor;
                        badge.textContent = String(r.factionDisplayName);
                        name.appendChild(badge);
                    }

                    info.appendChild(name);

                    if (r.activeGoal) {
                        const goal = document.createElement('div');
                        goal.className = 'resident-goal';
                        goal.textContent = String(r.activeGoal);
                        info.appendChild(goal);
                    }

                    row.appendChild(info);
                    rosterElement.appendChild(row);
                }
            }

            function formatTs(iso) {
                if (!iso) return '';
                try {
                    const d = new Date(iso);
                    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } catch (_) {
                    return iso;
                }
            }

            function pluralize(n, word) {
                return n + ' ' + word + (n === 1 ? '' : 's');
            }

            function render(payload) {
                const letters = Array.isArray(payload && payload.letters) ? payload.letters : (payload && payload.recentLetters) || [];
                const deathsToday = (payload && typeof payload.deathsToday === 'number') ? payload.deathsToday : 0;
                const asOf = (payload && payload.asOf) ? payload.asOf : '';
                const residents = (payload && Array.isArray(payload.residents)) ? payload.residents : [];

                deathsElement.textContent = pluralize(deathsToday, 'death') + ' today';
                asofElement.textContent = 'as of ' + formatTs(asOf);

                renderRoster(residents);

                const slice = letters.slice(0, maxCards);
                if (slice.length === 0) {
                    cardsElement.replaceChildren();
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    empty.textContent = 'No letters yet. Walk the embassy and find a resident to support.';
                    cardsElement.appendChild(empty);
                    return;
                }

                cardsElement.replaceChildren();
                slice.forEach(function (letter) {
                    cardsElement.appendChild(renderCard(letter));
                });
            }

            function showError(message) {
                cardsElement.replaceChildren();
                const err = document.createElement('div');
                err.className = 'error';
                err.textContent = 'Wall offline: ' + message;
                cardsElement.appendChild(err);
            }

            function poll() {
                fetch(apiBase, { cache: 'no-store' })
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error('endpoint returned ' + response.status);
                        }
                        return response.json();
                    })
                    .then(function (payload) {
                        render(payload);
                        firstFetchDone = true;
                    })
                    .catch(function (error) {
                        showError(error.message || String(error));
                    });
            }

            poll();
            setInterval(poll, intervalMs);
        })();
    </script>
</body>
</html>
