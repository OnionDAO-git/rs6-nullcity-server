<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Null City Embassy — Patron Status</title>
    <style>
        :root {
            --ink: #2a1d0e;
            --ink-soft: #5a4630;
            --vellum: #f5ecd6;
            --vellum-warm: #ebdfb8;
            --vellum-shadow: #d6c188;
            --vellum-edge: #d9c89e;
            --accent: #8a3324;
            --seal-standing: #6f8a3a;
            --seal-civic: #2f5070;
            --night: #1a120a;
            --night-soft: rgba(245, 236, 214, 0.85);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            color: var(--ink);
            font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, 'Georgia', serif;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(212, 155, 74, 0.07), transparent 55%),
                linear-gradient(180deg, var(--night) 0%, #110a04 100%);
        }
        header {
            text-align: center;
            padding: 2.25rem 1rem 1rem;
            color: var(--night-soft);
            font-variant: small-caps;
            letter-spacing: 0.12em;
            position: relative;
        }
        header::after {
            content: "";
            display: block;
            width: 5rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 155, 74, 0.5), transparent);
            margin: 0.85rem auto 0;
        }
        header h1 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: normal;
            text-shadow: 0 0 18px rgba(212, 155, 74, 0.15);
        }
        header .who {
            display: block;
            margin-top: 0.5rem;
            font-style: italic;
            color: rgba(245, 236, 214, 0.72);
            font-variant: normal;
            letter-spacing: 0;
            font-size: 1rem;
        }
        main {
            max-width: 32rem;
            margin: 0 auto;
            padding: 1rem 1.25rem 4rem;
        }
        .card {
            position: relative;
            background:
                radial-gradient(ellipse at top, rgba(255, 245, 215, 0.6), transparent 60%),
                radial-gradient(ellipse at center, var(--vellum) 65%, var(--vellum-warm) 100%);
            border: 1px solid var(--vellum-edge);
            border-radius: 2px;
            margin: 1.5rem 0;
            padding: 2rem 2.25rem 2.25rem;
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.5),
                0 1px 0 rgba(255, 250, 230, 0.4) inset,
                0 0 80px rgba(180, 140, 70, 0.06) inset;
        }
        /* aged-paper grain */
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 2px;
            pointer-events: none;
            background-image:
                radial-gradient(rgba(120, 85, 40, 0.04) 1px, transparent 1px),
                radial-gradient(rgba(120, 85, 40, 0.03) 1px, transparent 1px);
            background-size: 13px 13px, 17px 17px;
            background-position: 0 0, 6px 8px;
            mix-blend-mode: multiply;
        }
        /* deckle top edge */
        .card::after {
            content: "";
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            height: 6px;
            background:
                radial-gradient(circle at 20% 100%, var(--vellum) 4px, transparent 5px),
                radial-gradient(circle at 60% 100%, var(--vellum) 5px, transparent 6px),
                radial-gradient(circle at 85% 100%, var(--vellum) 3px, transparent 4px);
            pointer-events: none;
        }
        .card h2 {
            margin: 0 0 1.4rem 0;
            font-size: 1.3rem;
            font-weight: normal;
            border-bottom: 1px solid var(--vellum-shadow);
            padding-bottom: 0.55rem;
            color: var(--ink);
            letter-spacing: 0.01em;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid rgba(214, 193, 136, 0.4);
            padding: 0.6rem 0;
        }
        .stat-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .stat-label {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink-soft);
        }
        .stat-value {
            font-size: 1.12rem;
            color: var(--ink);
            font-weight: normal;
        }
        .stat-value.large {
            font-size: 1.55rem;
        }
        .tier-badge {
            display: inline-block;
            padding: 0.2rem 0.75rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-variant: small-caps;
            letter-spacing: 0.08em;
        }
        .tier-stranger  { background: rgba(90, 70, 48, 0.12); color: var(--ink-soft); border: 1px solid rgba(90, 70, 48, 0.25); }
        .tier-acquaintance { background: rgba(111, 138, 58, 0.12); color: #4a6120; border: 1px solid rgba(111, 138, 58, 0.3); }
        .tier-ally      { background: rgba(47, 80, 112, 0.12); color: #2f5070; border: 1px solid rgba(47, 80, 112, 0.3); }
        .tier-officer   { background: rgba(138, 51, 36, 0.12); color: var(--accent); border: 1px solid rgba(138, 51, 36, 0.3); }

        .progress-bar-wrap {
            margin-top: 0.75rem;
            background: rgba(214, 193, 136, 0.35);
            border-radius: 999px;
            height: 6px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--seal-standing), #a8c46a);
            border-radius: 999px;
            transition: width 0.6s ease;
        }
        .progress-hint {
            font-size: 0.78rem;
            color: var(--ink-soft);
            margin-top: 0.35rem;
            text-align: right;
        }

        .link-row {
            text-align: center;
            margin-top: 1.5rem;
        }
        .link-row a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.92rem;
            font-style: italic;
            letter-spacing: 0.02em;
            border-bottom: 1px solid rgba(138, 51, 36, 0.3);
            padding-bottom: 1px;
            transition: border-color 0.2s;
        }
        .link-row a:hover {
            border-color: var(--accent);
        }

        .checkin-row {
            text-align: center;
            margin-top: 1.25rem;
        }
        .checkin-btn {
            background: linear-gradient(135deg, var(--seal-standing), #7aaa3a);
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 0.6rem 1.5rem;
            font-family: inherit;
            font-size: 0.92rem;
            font-variant: small-caps;
            letter-spacing: 0.1em;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: opacity 0.2s;
        }
        .checkin-btn:hover { opacity: 0.88; }
        .checkin-btn:disabled { opacity: 0.5; cursor: default; }
        .checkin-toast {
            margin-top: 0.55rem;
            font-size: 0.85rem;
            font-style: italic;
            color: var(--seal-standing);
            min-height: 1.2em;
        }
        .checkin-toast.already { color: var(--ink-soft); }

        .letter-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(214, 193, 136, 0.4);
            padding: 0.55rem 0;
        }
        .letter-row:last-child { border-bottom: none; padding-bottom: 0; }
        .letter-subject {
            font-size: 0.9rem;
            color: var(--ink);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .letter-meta {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-shrink: 0;
        }
        .letter-kind {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-soft);
            opacity: 0.75;
        }
        .letter-date {
            font-size: 0.78rem;
            color: var(--ink-soft);
        }

        .resident-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(214, 193, 136, 0.4);
            padding: 0.55rem 0;
        }
        .resident-row:last-child { border-bottom: none; padding-bottom: 0; }
        .resident-name {
            font-size: 0.92rem;
            color: var(--ink);
            flex: 1;
        }
        .resident-meta {
            display: flex;
            gap: 0.45rem;
            align-items: center;
            flex-shrink: 0;
        }
        .res-state {
            font-size: 0.68rem;
            font-variant: small-caps;
            letter-spacing: 0.08em;
            padding: 0.1rem 0.4rem;
            border-radius: 2px;
        }
        .res-state-living   { background: rgba(60,130,60,0.12);  color: #2a5c2a; border: 1px solid rgba(60,130,60,0.3); }
        .res-state-reborn   { background: rgba(80,100,160,0.12); color: #2a3a6a; border: 1px solid rgba(80,100,160,0.3); }
        .res-state-deceased { background: rgba(90,50,30,0.12);  color: var(--accent); border: 1px solid rgba(138,51,36,0.3); }
        .res-faction {
            font-size: 0.72rem;
            color: var(--ink-soft);
            font-variant: small-caps;
            letter-spacing: 0.05em;
        }

        .empty, .error {
            text-align: center;
            color: rgba(245, 236, 214, 0.7);
            padding: 4rem 1rem;
            font-style: italic;
            font-size: 1.05rem;
        }
        .error {
            color: #ffd6d0;
            background: linear-gradient(180deg, rgba(110, 34, 24, 0.5), rgba(60, 18, 12, 0.4));
            border: 1px solid var(--accent);
            padding: 1.25rem 1.5rem;
            border-radius: 3px;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Null City Embassy — Patron Status</h1>
        <span class="who" id="who">…</span>
    </header>
    <main id="main">
        <div class="empty">Loading status…</div>
    </main>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const handle = params.get('human') || decodeURIComponent(
                (window.location.pathname.split('/').filter(Boolean).pop() || '')
            );

            const whoElement = document.getElementById('who');
            const mainElement = document.getElementById('main');

            if (!handle) {
                whoElement.textContent = '(no handle)';
                showError('Add ?human=<your-handle> to the URL.');
                return;
            }
            whoElement.textContent = handle;

            const apiHost = params.get('api') || '';

            // Fetch balance and standing in parallel; inbox is optional.
            const balanceUrl = (apiHost || '') + '/v1/patron/balance?human=' + encodeURIComponent(handle);
            const standingUrl = (apiHost || '') + '/v1/patron/standing?human=' + encodeURIComponent(handle);
            const inboxUrl = (apiHost || '') + '/v1/inbox?human=' + encodeURIComponent(handle);
            const residentsUrl = (apiHost || '') + '/v1/patron/residents?human=' + encodeURIComponent(handle);

            Promise.all([
                fetch(balanceUrl).then(r => r.ok ? r.json() : Promise.reject(new Error('balance ' + r.status))),
                fetch(standingUrl).then(r => r.ok ? r.json() : Promise.reject(new Error('standing ' + r.status))),
                fetch(inboxUrl).then(r => r.ok ? r.json() : null).catch(() => null),
            ])
                .then(function (results) {
                    const balance = results[0];
                    const standing = results[1];
                    const inbox = results[2];
                    renderCard(handle, balance, standing, inbox);
                    // Append residents card asynchronously — does not block the main render.
                    fetch(residentsUrl)
                        .then(function (r) { return r.ok ? r.json() : null; })
                        .catch(function () { return null; })
                        .then(function (data) {
                            if (data && Array.isArray(data.residents) && data.residents.length > 0) {
                                mainElement.appendChild(buildResidentsCard(data.residents));
                            }
                        });
                })
                .catch(function (error) {
                    showError('Could not load patron status: ' + (error.message || String(error)));
                });

            function renderCard(patronHandle, balance, standing, inbox) {
                mainElement.replaceChildren();

                const card = document.createElement('div');
                card.className = 'card';

                const heading = document.createElement('h2');
                heading.textContent = 'Your Standing at the Embassy';
                card.appendChild(heading);

                // Shard balance
                addStatRow(card, 'Shards',
                    (balance.balance || 0).toString(),
                    /* large= */ true
                );

                // Standing tier
                const tier = standing.tier || 'stranger';
                const tierEl = document.createElement('div');
                tierEl.className = 'stat-row';
                const tierLabel = document.createElement('span');
                tierLabel.className = 'stat-label';
                tierLabel.textContent = 'Standing';
                const tierValue = document.createElement('span');
                const badge = document.createElement('span');
                badge.className = 'tier-badge tier-' + tier;
                badge.textContent = capitalise(tier);
                tierValue.appendChild(badge);
                tierEl.appendChild(tierLabel);
                tierEl.appendChild(tierValue);
                card.appendChild(tierEl);

                // Progress to next tier
                if (standing.nextTier && standing.pointsToNext !== null && standing.pointsToNext !== undefined) {
                    const points = standing.points || 0;
                    const tierMin = standing.tierMin ?? 0;
                    const nextThreshold = points + standing.pointsToNext;
                    const range = nextThreshold - tierMin;
                    const progress = range > 0 ? Math.max(0, Math.min(1, (points - tierMin) / range)) : 0;

                    const progressRow = document.createElement('div');
                    progressRow.className = 'stat-row';
                    const plabel = document.createElement('span');
                    plabel.className = 'stat-label';
                    plabel.textContent = 'Progress';
                    const pwrap = document.createElement('div');
                    pwrap.style.flex = '1';
                    pwrap.style.marginLeft = '1.5rem';

                    const barWrap = document.createElement('div');
                    barWrap.className = 'progress-bar-wrap';
                    const fill = document.createElement('div');
                    fill.className = 'progress-bar-fill';
                    fill.style.width = Math.round(progress * 100) + '%';
                    barWrap.appendChild(fill);

                    const hint = document.createElement('div');
                    hint.className = 'progress-hint';
                    hint.textContent = standing.pointsToNext + ' Shards to ' + capitalise(standing.nextTier);

                    pwrap.appendChild(barWrap);
                    pwrap.appendChild(hint);
                    progressRow.appendChild(plabel);
                    progressRow.appendChild(pwrap);
                    card.appendChild(progressRow);
                } else if (!standing.nextTier) {
                    addStatRow(card, 'Rank', 'Officer — highest standing');
                }

                // Letter count
                if (inbox && Array.isArray(inbox.letters)) {
                    const letterCount = inbox.letters.length;
                    if (letterCount > 0) {
                        addStatRow(card, 'Letters received', letterCount.toString());
                    }
                }

                // Daily check-in button
                card.appendChild(buildCheckInSection(patronHandle, apiHost, balance));

                // Inbox link
                const linkRow = document.createElement('div');
                linkRow.className = 'link-row';
                const link = document.createElement('a');
                const inboxHref = '/inbox/?human=' + encodeURIComponent(patronHandle);
                link.href = inboxHref;
                link.textContent = 'Open your inbox →';
                linkRow.appendChild(link);
                card.appendChild(linkRow);

                mainElement.appendChild(card);

                // Recent letters card — shown only when there are letters
                if (inbox && Array.isArray(inbox.letters) && inbox.letters.length > 0) {
                    mainElement.appendChild(buildLettersCard(inbox.letters, patronHandle));
                }
            }

            function buildCheckInSection(patronHandle, apiHostValue, currentBalance) {
                const wrap = document.createElement('div');
                wrap.className = 'checkin-row';

                const btn = document.createElement('button');
                btn.className = 'checkin-btn';
                btn.textContent = 'Daily Check-In (+1 Shard)';

                const toast = document.createElement('div');
                toast.className = 'checkin-toast';

                btn.addEventListener('click', function () {
                    btn.disabled = true;
                    toast.textContent = 'Checking in…';
                    toast.className = 'checkin-toast';
                    const checkInUrl = (apiHostValue || '') + '/v1/patron/checkin?human=' + encodeURIComponent(patronHandle);
                    fetch(checkInUrl)
                        .then(function (r) { return r.json(); })
                        .then(function (data) {
                            if (data.result === 'checked_in') {
                                toast.textContent = '+' + data.shards_earned + ' Shard earned! Balance: ' + data.new_balance;
                                toast.className = 'checkin-toast';
                                // Refresh balance display in the card without full reload
                                const balEls = document.querySelectorAll('.stat-value.large');
                                if (balEls.length > 0) { balEls[0].textContent = String(data.new_balance); }
                            } else {
                                toast.textContent = 'Already checked in today — come back tomorrow.';
                                toast.className = 'checkin-toast already';
                            }
                            btn.disabled = false;
                        })
                        .catch(function () {
                            toast.textContent = 'Check-in unavailable right now.';
                            toast.className = 'checkin-toast already';
                            btn.disabled = false;
                        });
                });

                wrap.appendChild(btn);
                wrap.appendChild(toast);
                return wrap;
            }

            function buildLettersCard(letters, patronHandle) {
                const card = document.createElement('div');
                card.className = 'card';

                const heading = document.createElement('h2');
                heading.textContent = 'Recent Correspondence';
                card.appendChild(heading);

                const sorted = letters.slice().sort(function (a, b) {
                    const da = a.dispatchedAt ? new Date(a.dispatchedAt).getTime() : 0;
                    const db = b.dispatchedAt ? new Date(b.dispatchedAt).getTime() : 0;
                    return db - da;
                }).slice(0, 3);

                sorted.forEach(function (letter) {
                    const row = document.createElement('div');
                    row.className = 'letter-row';

                    const subject = document.createElement('span');
                    subject.className = 'letter-subject';
                    subject.textContent = letter.subject || '(untitled)';

                    const meta = document.createElement('span');
                    meta.className = 'letter-meta';

                    const kindEl = document.createElement('span');
                    kindEl.className = 'letter-kind';
                    kindEl.textContent = letterKindLabel(letter.kind);

                    const dateEl = document.createElement('span');
                    dateEl.className = 'letter-date';
                    dateEl.textContent = formatLetterDate(letter.dispatchedAt);

                    meta.appendChild(kindEl);
                    meta.appendChild(dateEl);
                    row.appendChild(subject);
                    row.appendChild(meta);
                    card.appendChild(row);
                });

                const linkRow = document.createElement('div');
                linkRow.className = 'link-row';
                const link = document.createElement('a');
                link.href = '/inbox/?human=' + encodeURIComponent(patronHandle);
                link.textContent = letters.length > 3
                    ? 'Read all ' + letters.length + ' letters →'
                    : 'Read your letters →';
                linkRow.appendChild(link);
                card.appendChild(linkRow);

                return card;
            }

            function letterKindLabel(kind) {
                switch (kind) {
                    case 'standing_tier_crossed': return 'standing';
                    case 'epitaph': return 'epitaph';
                    case 'civic': return 'civic';
                    case 'broadcast': return 'city news';
                    default: return kind || '';
                }
            }

            function formatLetterDate(iso) {
                if (!iso) return '';
                try {
                    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                } catch (_) {
                    return '';
                }
            }

            function addStatRow(parent, label, value, large) {
                const row = document.createElement('div');
                row.className = 'stat-row';
                const labelEl = document.createElement('span');
                labelEl.className = 'stat-label';
                labelEl.textContent = label;
                const valueEl = document.createElement('span');
                valueEl.className = large ? 'stat-value large' : 'stat-value';
                valueEl.textContent = value;
                row.appendChild(labelEl);
                row.appendChild(valueEl);
                parent.appendChild(row);
            }

            function capitalise(str) {
                if (!str) return '';
                return str.charAt(0).toUpperCase() + str.slice(1);
            }

            function buildResidentsCard(residents) {
                const card = document.createElement('div');
                card.className = 'card';

                const heading = document.createElement('h2');
                heading.textContent = 'Residents You’ve Known';
                card.appendChild(heading);

                residents.forEach(function (r) {
                    const row = document.createElement('div');
                    row.className = 'resident-row';

                    const name = document.createElement('span');
                    name.className = 'resident-name';
                    name.textContent = r.displayName || r.slug;
                    row.appendChild(name);

                    const meta = document.createElement('span');
                    meta.className = 'resident-meta';

                    if (r.factionDisplayName) {
                        const faction = document.createElement('span');
                        faction.className = 'res-faction';
                        faction.textContent = r.factionDisplayName;
                        if (r.factionColor) { faction.style.color = r.factionColor; }
                        meta.appendChild(faction);
                    }

                    const state = r.currentState || 'living';
                    const badge = document.createElement('span');
                    badge.className = 'res-state res-state-' + state;
                    badge.textContent = state === 'deceased' ? 'gone' : state === 'reborn' ? 'reborn' : 'living';
                    meta.appendChild(badge);

                    row.appendChild(meta);
                    card.appendChild(row);
                });

                const linkRow = document.createElement('div');
                linkRow.className = 'link-row';
                const link = document.createElement('a');
                link.href = '/library/';
                link.textContent = 'View all in the Library →';
                linkRow.appendChild(link);
                card.appendChild(linkRow);

                return card;
            }

            function showError(message) {
                mainElement.replaceChildren();
                const err = document.createElement('div');
                err.className = 'error';
                err.textContent = message;
                mainElement.appendChild(err);
            }
        })();
    </script>
</body>
</html>
